[project]
name = "literature-assistant"
version = "0.1.0"
description = "学术文献监控与专题知识归档系统"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "skills"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# test_phase0.py 是端到端 smoke demo（调真实 Crossref/LLM API），用
# `python -m tests.test_phase0` 手动运行，不是 pytest unit test —— 它的
# test_* 函数接受 crossref/db/llm_client 等位置参数，pytest 会把它们误认成
# fixture 请求从而报 collection error。真正的 regression test 在
# test_identity_resolution.py 等文件里。
addopts = "--ignore=tests/test_phase0.py"
